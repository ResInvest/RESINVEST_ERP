[project]
name = "genresinvest"
version = "1.0.0"
description = "GenResInvest 1.0 — generator zleceń ResInvest Commodities PL S.A."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"
