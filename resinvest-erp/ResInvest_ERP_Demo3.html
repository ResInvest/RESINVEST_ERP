}
function validateTransport(state, d, errors) {
  if (!String(d.transport.place || "").trim()) errors["transport.place"] = "Do poprawy. Wpisz miejsce dostawy, na przykład RiC Zabrze.";
  const mode = d.transport.mode;
  if (mode === "supplier" && d.type !== "ZAKUP") errors["transport.mode"] = "Do poprawy. Transport w cenie zakupu jest tylko przy zakupie. Wybierz inny rodzaj.";
  if (mode === "own" || mode === "mixed") checkRuns(d.transport.own, "transport.own", false, errors);
  if (mode === "external" || mode === "mixed") {
    if (!String(d.transport.external.company || "").trim()) errors["transport.external.company"] = "Do poprawy. Wpisz nazwę firmy transportowej, na przykład ESI Logistics.";
    checkRuns(d.transport.external, "transport.external", true, errors);

    if (d.transport.train.tonMode === "each") {

      for (let i = 0; i < count; i++) {
        const m = numMsg(d.transport.train.wagonT[i], "tonaż wagonu " + (i + 1), "58,4");
        if (m) errors["transport.train.wagonT." + i] = m;

    } else if (numMsg(d.transport.train.sameT, "tonaż jednego wagonu", "60")) errors["transport.train.sameT"] = numMsg(d.transport.train.sameT, "tonaż jednego wagonu", "60");
    if (numMsg(d.transport.train.price, "cenę frachtu", "25")) errors["transport.train.price"] = numMsg(d.transport.train.price, "cenę frachtu", "25");

}
function checkRuns(group, prefix, external, errors) {
  const n = parseNum(group.runCount);
  if (!n.ok || n.value < 1 || n.value > 4 || !Number.isInteger(n.value)) {
    errors[prefix + ".runCount"] = "Do poprawy. Wpisz liczbę kursów od 1 do 4. W programie firmowym limit kursów jest wyższy.";
    return;

  for (let i = 0; i < n.value; i++) {
    const r = group.runs[i] || {};
    const base = prefix + ".runs." + i + ".";
    if (external) {
      if (!String(r.reg || "").trim()) errors[base + "reg"] = "Do poprawy. Wpisz numer rejestracyjny, na przykład ESI 18734.";
    } else {
      if (!String(r.vehicleReg || "").trim()) errors[base + "vehicleReg"] = "Do poprawy. Wpisz numer rejestracyjny, na przykład WGM 12345.";
      if (!String(r.driverName || "").trim()) errors[base + "driverName"] = "Do poprawy. Wpisz imię i nazwisko kierowcy.";
    }
    const km = parseNum(r.km), freight = parseNum(r.freight);
    if (external && freight.ok && freight.value > 0) { /* fracht zastępuje km */ }
    else if (!km.ok || !(km.value > 0)) errors[base + "km"] = external
      ? "Do poprawy. Wpisz kilometry, na przykład 80, albo fracht kursu w złotych."
      : "Do poprawy. Wpisz kilometry tego kursu, na przykład 45.";
  }
}
function producedMp(d) {
  if (d.production.outQty) { const r = parseNum(d.production.outQty); return r.ok ? r.value : null; }
  const src = d.type === "ZAKUP" ? parseNum(d.production.consumeQty || d.purchase.qty) : parseNum(d.production.outQty);
  if (!src.ok) return null;
  const unit = d.type === "ZAKUP" ? (d.purchase.unit || "m3") : "m3";
  if (unit === "m3") return src.value * 4;
  if (unit === "MP") return src.value;
  return null;
}
function maxOutMp(d) {
  const src = parseNum(d.production.consumeQty || d.purchase.qty);
  if (!src.ok) return null;
  return (d.purchase.unit || "m3") === "m3" ? src.value * 4 : src.value;
}
function soldMp(d) {
  if (!d.sale.qtyMP) return producedMp(d);
  const r = parseNum(d.sale.qtyMP);
  return r.ok ? r.value : null;
}
function massOf(qty, unit, product, manual) {
  const m = parseNum(manual);
  if (m.ok) return m.value;
  const t = convert(qty, unit, "t", product);
  return t == null ? null : t;
}

function planCommit(state, d, usr, whId) {
  const existing = state.operations.find(o => o.idemKey && o.idemKey === d.idemKey);
  if (existing) return { ok: true, op: existing, state, idempotent: true };
  const errors = validateDraft(state, d, whId);
  const hard = Object.keys(errors).filter(k => !k.endsWith("Warn"));
  if (hard.length) return { ok: false, errors };
  const next = structuredClone(state);
  next.rev = state.rev + 1;
  let partnerId = "";
  if (d.type === "ZAKUP") partnerId = ensurePartner(next, d.purchase.supplierName, "supplier", d.purchase.supplierKind);
  if (d.type === "SPRZEDAZ" || d.sale.direct) partnerId = ensurePartner(next, d.sale.buyerName, "buyer", "firma");
  const no = d.type === "PRODUKCJA" || d.docNoMode.WZ !== "manual" ? suggestNo(next, d.date) : String(d.docNos.WZ).trim();
  const op = {
    id: uid("op_"), idemKey: d.idemKey, date: d.date, type: d.type, status: d.type === "MM" ? "W_DRODZE" : "POSTED",
    no, whId, toWhId: d.type === "MM" ? d.mm.toWhId : "", partnerId, productId: "", qty: 0, unit: "",
    priceUnit: "", price: null, basis: d.purchase.basis || "", userName: usr.name, kwit: d.production.kwit || "",
    extDoc: String(d.extDoc || "").trim(), lesnictwo: d.purchase.lesnictwo || d.production.lesnictwo || "", notes: d.notes || ""
  };
  if (d.type === "ZAKUP") applyPurchase(next, d, whId, op);
  else if (d.type === "SPRZEDAZ") applySale(next, d, whId, op);
  else if (d.type === "PRODUKCJA") applyStockProd(next, d, whId, op);
  else applyMm(next, d, whId, op);
  if (op._error) return { ok: false, errors: { date: op._error } };
  delete op._error;
  next.operations.push(op);
  return { ok: true, op, state: next };
}
function ensurePartner(state, name, role, kind) {
  const f = fold(name);
  let p = state.partners.find(x => fold(x.name) === f);
  if (!p) {
    p = { id: uid("pa_"), name: String(name).trim(), role, kind: kind || "firma", city: "" };
    state.partners.push(p);
  }
  return p.id;
}
function applyPurchase(state, d, whId, op) {
  const prod = productById(d.purchase.productId);
  const qty = parseNum(d.purchase.qty).value;
  const stockQty = convert(qty, d.purchase.unit, prod.unit, prod);
  op.productId = prod.id; op.qty = qty; op.unit = d.purchase.unit; op.priceUnit = d.purchase.priceUnit || d.purchase.unit;
  op.price = parseNum(d.purchase.price).value;
  let stock = stockAdd(state.stock, whId, prod.id, stockQty);
  if (d.production.enabled) {
    const consume = parseNum(d.production.consumeQty || d.purchase.qty).value;
    const consumeStock = convert(consume, d.purchase.unit, prod.unit, prod);
    const outId = PROD[d.production.type][1];
    const outQty = producedMp(d) || 0;
    stock = stockAdd(stock, whId, prod.id, -consumeStock);
    if (!d.sale.direct) stock = stockAdd(stock, whId, outId, outQty);
    op.kwit = d.production.kwit || op.kwit;
    if (d.sale.direct) { op.type = "ZAKUP"; op.productId = outId; op.qty = soldMp(d) || outQty; op.unit = "MP"; op.price = parseNum(d.sale.price).value; }
  }
  if (stockGet(stock, whId, prod.id) < -0.001) { op._error = "Do poprawy. Po tej operacji stan surowca spadłby poniżej zera. Zmniejsz zużycie."; return; }
  state.stock = stock;
}
function applySale(state, d, whId, op) {
  if (d.sale.direct) {
    const raw = productById(d.production.rawProductId) || productById("pr_drewno");
    const outId = (productById(d.production.outProductId) || {}).id || PROD[d.production.type][1];
    const outQty = producedMp(d) || parseNum(d.production.outQty).value || 0;
    op.productId = outId; op.qty = soldMp(d) || outQty; op.unit = "MP"; op.price = parseNum(d.sale.price).value; op.priceUnit = d.sale.priceUnit || "MP";
    if (raw) {
      const consume = raw.unit === "m3" ? op.qty / 4 : op.qty;
      if (consume > stockGet(state.stock, whId, raw.id) + 0.001 && d.production.rawProductId) {
        op._error = "Do poprawy. Brakuje surowca na tę produkcję. Wpisz mniejszą ilość."; return;
      }
      if (d.production.rawProductId) state.stock = stockAdd(state.stock, whId, raw.id, -consume);
    }
    return;
  }
  const prod = productById(d.sale.productId);
  const qty = parseNum(d.sale.qty).value;
  const need = convert(qty, d.sale.unit || prod.unit, prod.unit, prod);
  op.productId = prod.id; op.qty = qty; op.unit = d.sale.unit || prod.unit; op.price = parseNum(d.sale.price).value; op.priceUnit = op.unit;
  state.stock = stockAdd(state.stock, whId, prod.id, -need);
}
function applyStockProd(state, d, whId, op) {
  const raw = productById(d.production.rawProductId);
  const out = productById(d.production.outProductId);
  const outQty = parseNum(d.production.outQty).value;
  const consume = raw.unit === "m3" && out.unit === "MP" ? outQty / 4 : outQty;
  op.productId = out.id; op.qty = outQty; op.unit = out.unit;
  let stock = stockAdd(state.stock, whId, raw.id, -consume);
  stock = stockAdd(stock, whId, out.id, outQty);
  state.stock = stock;
}
function applyMm(state, d, whId, op) {
  const prod = productById(d.mm.productId);
  const qty = parseNum(d.mm.qty).value;
  const need = convert(qty, d.mm.unit || prod.unit, prod.unit, prod);
  op.productId = prod.id; op.qty = qty; op.unit = d.mm.unit || prod.unit; op.stockQty = need; op.toWhId = d.mm.toWhId;
  state.stock = stockAdd(state.stock, whId, prod.id, -need);
}

function buildIndex(state) {
  const rows = [];
  for (const p of state.partners) rows.push({ id: p.id, route: "kontrahenci", title: p.name, meta: (p.role === "buyer" ? "Odbiorca" : p.role === "both" ? "Dostawca i odbiorca" : "Dostawca") + (p.city ? " · " + p.city : ""), hay: fold(p.name + " " + p.city + " " + p.role) });
  for (const p of state.products) rows.push({ id: p.id, route: "stany", title: p.name, meta: "Produkt · " + unitLabel(p.unit), hay: fold(p.name + " " + p.unit) });
  for (const op of state.operations) rows.push({ id: op.id, route: "operacje", title: op.no, meta: TYPES[op.type] + " · " + shortDate(op.date), hay: fold([op.no, op.kwit, op.extDoc, partyName(op), (productById(op.productId) || {}).name, TYPES[op.type], op.userName, whName(op.whId)].join(" ")) });
  return rows;
}
function rebuildIndex() { INDEX = buildIndex(dbState); }

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("riw.demo3", 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains("bundle")) req.result.createObjectStore("bundle"); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGet(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction("bundle", "readonly");
    const rq = tx.objectStore("bundle").get("current");
    rq.onsuccess = () => resolve(rq.result || null);
    rq.onerror = () => reject(rq.error);
  });
}
function idbPut(db, bundle) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction("bundle", "readwrite");
    tx.objectStore("bundle").put(bundle, "current");
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error("Transakcja przerwana"));
  });
}
function validBundle(b) { return !!(b && b.state && Array.isArray(b.state.operations) && Array.isArray(b.journal) && typeof b.state.rev === "number"); }
async function persist(next, nextJournal) {
  const bundle = { state: next, journal: nextJournal };
  let idbOk = false;
  if (dbp) { try { await idbPut(dbp, bundle); idbOk = true; } catch (e) { idbOk = false; } }
  try { localStorage.setItem(LS, JSON.stringify(bundle)); }
  catch (e) { if (!idbOk) throw e; }
  persistMode = idbOk ? "indexeddb" : "localstorage";
}
async function makeEntry(next, cmd, who) {
  const prev = journal.length ? journal[journal.length - 1].hash : "GENESIS";
  const snapshot = structuredClone(next);
  const hash = sha256(prev + "\n" + canonical({ rev: snapshot.rev, n: snapshot.operations.length, stock: snapshot.stock }));
  return { seq: next.rev, ts: new Date().toISOString(), cmd, user: who, hash, prev, snapshot };
}
const Store = {
  async exec(cmd, args) {
    if (cmd === "op.commit") {
      const built = planCommit(dbState, args.draft, user, activeWh());
      if (!built.ok) return built;
      if (built.idempotent) return { ok: true, op: built.op };
      const entry = await makeEntry(built.state, "op.commit", user.name);
      const nextJournal = journal.concat(entry);
      await persist(built.state, nextJournal);
      dbState = built.state; journal = nextJournal; rebuildIndex();
      return { ok: true, op: built.op };
    }
    if (cmd === "mm.receive") {
      const op = dbState.operations.find(o => o.id === args.opId);
      if (!op || op.status !== "W_DRODZE") return { ok: false, error: "To przesunięcie nie czeka na przyjęcie. Odśwież rejestr." };
      if (!canReceive(op)) return { ok: false, error: "Przyjęcie wykonuje osoba magazynu docelowego. Przełącz magazyn na " + whName(op.toWhId) + "." };
      const next = structuredClone(dbState);
      next.rev = dbState.rev + 1;
      const row = next.operations.find(o => o.id === op.id);
      const qty = row.stockQty != null ? row.stockQty : row.qty;
      next.stock = stockAdd(next.stock, row.toWhId, row.productId, qty);
      row.status = "POSTED";
      const entry = await makeEntry(next, "mm.receive", user.name);
      const nextJournal = journal.concat(entry);
      await persist(next, nextJournal);
      dbState = next; journal = nextJournal; rebuildIndex();
      return { ok: true };
    }
    if (cmd === "backup.restore") {
      const next = structuredClone(args.state);
      const hist = Array.isArray(args.journal) && args.journal.length ? args.journal : journal;
      const entry = await makeEntry(next, "backup.restore", user.name);
      const nextJournal = hist.concat(entry);
      entry.snapshot = structuredClone(next);
      await persist(next, nextJournal);
      dbState = next; journal = nextJournal; rebuildIndex();
      return { ok: true };
    }
    return { ok: false, error: "Nieznane polecenie." };
  }
};

function writeBind(el) {
  if (!el || !el.dataset || !el.dataset.bind || el.disabled) return;
  const key = el.dataset.bind;
  if (el.type === "checkbox") setPath(draft, key, el.checked);
  else if (el.type === "radio") { if (!el.checked) return; setPath(draft, key, el.value); }
  else setPath(draft, key, el.value);
  if (key === "transport.place") draft.transport.placeTouched = true;
  if (key === "purchase.basis") draft.basisTouched = true;
  if (key === "purchase.unit" || key === "purchase.priceUnit") draft.unitTouched = true;
  if (key === "purchase.supplierKind" && !draft.basisTouched) draft.purchase.basis = el.value === "nadlesnictwo" ? "DEKL" : "KZR";
  if (key === "sale.direct" && el.checked) { draft.production.enabled = true; draft.sale.enabled = true; }
  if (key === "sale.direct" && !el.checked) draft.sale.enabled = false;
  if (key === "production.enabled" && el.checked === false) { draft.sale.direct = false; draft.sale.enabled = false; }
  if (key === "purchase.productId" && !draft.unitTouched) {
    const p = productById(el.value);
    if (p) { draft.purchase.unit = p.unit; draft.purchase.priceUnit = p.unit; }
  }
  if (key === "transport.own.runCount") { const n = intRange(el.value, 1, 4); if (n) ui.ownShown = n; }
  if (key === "transport.external.runCount") { const n = intRange(el.value, 1, 4); if (n) ui.extShown = n; }
}
function intRange(raw, a, b) {
  const n = Number(String(raw).trim());

}
function readAll() {

  if (push) pushDraft();

    if (document.activeElement !== unitSel) unitSel.value = draft.purchase.unit;

  }
}
function costNow() {
  const p = draft.purchase, prod = productById(p.productId);
  const q = parseNum(p.qty), price = parseNum(p.price);
  if (!q.ok || !price.ok || !prod) return null;
  const qty = convert(q.value, p.unit, p.priceUnit || p.unit, prod);
  return qty == null ? null : Math.round(qty * price.value * 100) / 100;
}
function updateComputed() {
  if (!form || !draft) return;
  const set = (id, val) => { const el = document.getElementById(id); if (el && document.activeElement !== el) el.value = val; };
  const cost = costNow();
  set("f-purchase-cost", cost == null ? "—" : plMoney(cost));
  const prod = productById(draft.purchase.productId);
  const q = parseNum(draft.purchase.qty);
  let mass = "—";
  if (draft.purchase.weightMode === "manual") {
    const m = parseNum(draft.purchase.weightManual);
    if (m.ok) mass = plQty(m.value) + " t · " + plQty(m.value * dbState.config.t_gj) + " GJ";
  } else if (q.ok && prod) {
    const t = massOf(q.value, draft.purchase.unit, prod, "");
    if (t != null) mass = plQty(t) + " t · " + plQty(t * dbState.config.t_gj) + " GJ";
  }
  set("f-purchase-weightAuto", mass);
  const no = draft.docNoMode.WZ === "manual" && String(draft.docNos.WZ || "").trim() ? String(draft.docNos.WZ).trim() : suggestNo(dbState, draft.date || todayISO());
  const s1 = document.getElementById("sum-1"), s2 = document.getElementById("sum-2"), s3 = document.getElementById("sum-3");
  if (s1) s1.textContent = draft.type === "ZAKUP" ? "Koszt zakupu: " + (cost == null ? "uzupełnij ilość i cenę" : plMoney(cost)) : "Dokument powstanie po zapisie.";
  if (s2) s2.textContent = draft.type === "ZAKUP" ? "Masa orientacyjna: " + mass : "";
  if (s3) s3.textContent = draft.type === "PRODUKCJA" ? "Numer nada program z serii WZ." : "Dokument: " + no;
  const sp = productById(draft.sale.productId);
  if (sp && draft.type === "SPRZEDAZ" && !draft.sale.direct) {
    const have = stockGet(dbState.stock, activeWh(), sp.id);
    set("f-sale-onStock", plQty(have) + " " + unitLabel(sp.unit));
    const sq = parseNum(draft.sale.qty);
    const need = sq.ok ? convert(sq.value, draft.sale.unit || sp.unit, sp.unit, sp) : null;
    set("f-sale-after", need == null ? "—" : plQty(round3(have - need)) + " " + unitLabel(sp.unit));
    const price = parseNum(draft.sale.price);
    set("f-sale-revenue", sq.ok && price.ok ? plMoney(sq.value * price.value) : "—");
  }
  const mp = productById(draft.mm.productId);
  if (mp && draft.type === "MM") {
    const have = stockGet(dbState.stock, activeWh(), mp.id);
    const mq = parseNum(draft.mm.qty);
    const need = mq.ok ? convert(mq.value, draft.mm.unit || mp.unit, mp.unit, mp) : null;
    set("f-mm-srcBal", need == null ? plQty(have) + " " + unitLabel(mp.unit) : plQty(have) + " → " + plQty(round3(have - need)) + " " + unitLabel(mp.unit));
    const dest = draft.mm.toWhId ? stockGet(dbState.stock, draft.mm.toWhId, mp.id) : 0;
    set("f-mm-dstBal", !draft.mm.toWhId || need == null ? "—" : plQty(dest) + " → " + plQty(round3(dest + need)) + " " + unitLabel(mp.unit));
  }
  const outMp = producedMp(draft);
  const rate = parseNum(draft.production.chipRate);
  const chip = outMp != null ? outMp * (rate.ok ? rate.value : dbState.config.chipRate) : null;
  set("f-production-chipCost", chip == null ? "—" : plMoney(chip));
}
function applyFieldNote(key) {

function visibleOf(list) {

}
function fieldEl(key) {

function setNote(key, text, kind) {
  const field = form && visibleOf([...form.querySelectorAll("[data-field]")].filter(el => el.dataset.field === key));
  if (!field) return;
  let note = field.querySelector(":scope > .msg, :scope > .hint.dynamic");
  const input = field.querySelector("[data-bind]");
  if (!text) {
    field.classList.remove("is-error");
    if (input) input.removeAttribute("aria-invalid");
    if (note) note.remove();
    return;
  }
  if (!note) {
    note = document.createElement("p");
    field.appendChild(note);
  }
  note.className = kind === "error" ? "msg" : "hint dynamic";
  note.textContent = text;
  if (kind === "error") {
    field.classList.add("is-error");
    if (input) input.setAttribute("aria-invalid", "true");
  } else field.classList.remove("is-error");
  if (input) input.setAttribute("aria-describedby", note.id || (note.id = "note-" + key.replace(/\./g, "-")));
}

    const el = fieldEl(hard[0]);
    if (el) el.focus();
    return;
  }
  saving = true;
  const controls = [...form.querySelectorAll("input, select, textarea, button")];
  controls.forEach(el => { el.dataset.wasDisabled = el.disabled ? "1" : ""; el.disabled = true; });

  if (status) status.textContent = "Trwa zapis operacji. Poczekaj, aż pojawi się numer dokumentu.";
  try {
    if (window.__demo && window.__demo.hold) await window.__demo.hold;
    else await new Promise(r => setTimeout(r, 450));
    const res = await Store.exec("op.commit", { draft });
    if (!res.ok) {
      unlockForm(controls);
      if (res.errors) { Object.keys(res.errors).forEach(k => setNote(k, res.errors[k], "error")); showErrorSummary(res.errors); }
      if (status) status.textContent = res.error || "Nie udało się zapisać. Popraw pola i spróbuj jeszcze raz.";
      return;

    draft = null; touched = new Set();
    flash = "Zapisano dokument " + res.op.no + ". Stan magazynu został zaktualizowany.";

    unlockForm(controls);
    if (status) status.textContent = "Nie udało się zapisać. Sprawdź, czy przeglądarka pozwala tej stronie trzymać dane, i spróbuj jeszcze raz.";

}
function unlockForm(controls) {
  if (!form) return;
  form.classList.remove("is-loading");
  form.removeAttribute("aria-busy");
  (controls || []).forEach(el => { if (el.dataset.wasDisabled !== "1") el.disabled = false; delete el.dataset.wasDisabled; });
  const btn = document.getElementById("f-save");
  if (btn) btn.textContent = "Zapisz operację";
  syncVisibility(false);
}
function lockForm() {
  form.querySelectorAll("input, select, textarea, button").forEach(el => { el.disabled = true; });
}
function focusables() {
  return [...form.querySelectorAll("input, select, textarea, button")].filter(el => !el.disabled && !el.hidden && !el.closest("[hidden]"));
}
function onFormKey(e) {

  e.preventDefault();
  const list = focusables();
  const i = list.indexOf(e.target);

}
function onFormBlur(e) {

  writeBind(e.target);

}
function onFormChange(e) {

function comboItems(kind, query) {
  const q = fold(query);
  const list = kind === "buyer"
    ? dbState.partners.filter(p => ["buyer", "both"].includes(p.role))
    : dbState.partners.filter(p => ["supplier", "both"].includes(p.role) && (draft.purchase.supplierKind === "nadlesnictwo" ? p.kind === "nadlesnictwo" : p.kind !== "nadlesnictwo"));
  return list.filter(p => !q || fold(p.name).includes(q) || fold(p.city).includes(q)).slice(0, 8);
}
function refreshCombo(input) {

  const items = comboItems(input.dataset.combo, input.value);
  list.innerHTML = items.map((p, i) => `<li><button type="button" tabindex="-1" role="option" id="${list.id}-${i}" data-name="${esc(p.name)}" data-id="${esc(p.id)}" data-combo-for="${esc(input.id)}">${esc(p.city ? p.name + " — " + p.city : p.name)}</button></li>`).join("");

function renderSearch() {
  const pop = document.getElementById("search-pop");
  const q = document.getElementById("q");
  if (!pop || !q) return;
  const query = searchQuery.trim();
  if (!query) { pop.hidden = true; q.setAttribute("aria-expanded", "false"); searchHits = []; return; }
  const t0 = performance.now();
  const parts = fold(query).split(" ").filter(Boolean);
  searchHits = INDEX.filter(r => parts.every(p => r.hay.includes(p))).slice(0, 8);
  const ms = performance.now() - t0;
  pop.innerHTML = searchHits.map((h, i) => `<button type="button" tabindex="-1" class="search-hit" role="option" data-act="hit" data-i="${i}"><b>${esc(h.title)}</b><br><span>${esc(h.meta)}</span></button>`).join("")
    + `<p class="meta" style="padding:calc(var(--s) * 2) calc(var(--s) * 4)">${searchHits.length ? searchHits.length + " z indeksu " + INDEX.length : "Brak pozycji. Spróbuj krótszej frazy."} · ${ms < 0.1 ? "poniżej 0,1" : ms.toFixed(1).replace(".", ",")} ms</p>`;
  pop.hidden = false;

function filterTables() {
  const n = fold(searchQuery);
  const rows = document.querySelectorAll("tr[data-hay]");
  let shown = 0;
  rows.forEach(row => {
    const ok = !n || row.dataset.hay.includes(n);
    row.hidden = !ok;
    if (ok) shown += 1;
  });
  document.querySelectorAll(".empty-filter").forEach(empty => {
    const table = empty.previousElementSibling;
    const own = table ? [...table.querySelectorAll("tr[data-hay]")] : [];
    const alive = own.filter(r => !r.hidden).length;
    empty.hidden = !(n && own.length && alive === 0);
  });
}
function goHit(i) {

  if (!hit) return;
  highlightId = hit.id;
  searchQuery = "";
  const pop = document.getElementById("search-pop");

function doLogin() {

  const found = USERS.find(u => u.email === email);

  if (password !== PASS) { show("Hasło nie pasuje. W wersji demonstracyjnej wpisz demo1234."); document.getElementById("login-password").focus(); return; }
  user = found;
  sessionStorage.setItem("riw.demo3.user", user.id);

function ask(title, text, ok, cancel) {
  return new Promise(resolve => {
    const dlg = document.createElement("dialog");
    dlg.innerHTML = `<h2 id="dlg-title">${esc(title)}</h2><p class="block">${esc(text)}</p><div class="dlg-actions"><button class="btn" type="button" data-no autofocus>${esc(cancel)}</button><button class="btn primary" type="button" data-ok>${esc(ok)}</button></div>`;
    dlg.setAttribute("aria-labelledby", "dlg-title");
    document.body.appendChild(dlg);
    let done = false;
    const finish = v => { if (done) return; done = true; dlg.close(); dlg.remove(); resolve(v); };
    dlg.querySelector("[data-ok]").onclick = () => finish(true);
    dlg.querySelector("[data-no]").onclick = () => finish(false);
    dlg.addEventListener("cancel", ev => { ev.preventDefault(); finish(false); });
    dlg.showModal();
  });
}
async function undoLast() {
  if (journal.length < 2) return;
  const ok = await ask("Cofnąć ostatni zapis?", "Stan wróci do poprzedniej rewizji. Żeby zachować obecne dane, najpierw wyeksportuj kopię.", "Cofnij zapis", "Zostaw jak jest");
  if (!ok) return;
  const nextJournal = journal.slice(0, -1);
  const snap = structuredClone(nextJournal[nextJournal.length - 1].snapshot);
  await persist(snap, nextJournal);
  dbState = snap; journal = nextJournal; rebuildIndex();
  flash = "Przywrócono rewizję " + snap.rev + ".";
  paint();
}
async function restoreSeq(seq) {
  const i = journal.findIndex(e => String(e.seq) === String(seq));
  if (i < 0) return;
  const ok = await ask("Wrócić do rewizji " + seq + "?", "Późniejsze zapisy znikną z dziennika w tej przeglądarce. Eksport kopii robi to wcześniej, jeśli chcesz je zachować.", "Wróć do rewizji", "Zostaw jak jest");
  if (!ok) return;
  const nextJournal = journal.slice(0, i + 1);
  const snap = structuredClone(nextJournal[nextJournal.length - 1].snapshot);
  await persist(snap, nextJournal);
  dbState = snap; journal = nextJournal; rebuildIndex();
  flash = "Przywrócono rewizję " + snap.rev + ".";
  paint();
}
function exportCopy() {
  const payload = { format: "resinvest-erp-demo3", exportedAt: new Date().toISOString(), rev: dbState.rev, state: dbState, journal };
  const a = document.createElement("a");

async function importFile(input) {
  const file = input.files && input.files[0];

  try { data = JSON.parse(await file.text()); }
  catch (e) { flash = "Nie udało się odczytać pliku. Wybierz plik JSON wyeksportowany z tej wersji."; paint(); return; }
  if (!data || data.format !== "resinvest-erp-demo3" || !data.state || !Array.isArray(data.state.operations)) {
    flash = "Ten plik nie jest kopią wersji demonstracyjnej 3. Użyj pliku z przycisku „Eksportuj kopię JSON”.";
    paint(); return;
  }
  const ok = await ask("Wczytać tę kopię?", "Zastąpi dane w tej przeglądarce. Rewizja pliku: " + data.state.rev + ".", "Wczytaj kopię", "Anuluj");
  if (!ok) return;
  const res = await Store.exec("backup.restore", { state: data.state, journal: data.journal });

  paint();
}
function repeatLast() {

    if (name === "fill") {

      const res = await Store.exec("mm.receive", { opId: act.dataset.id });

document.body.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s" && user && route === "operacja" && canCreate(user)) {
    e.preventDefault(); save();
  }
  if (e.key === "Escape") {
    const sb = document.getElementById("sidebar");

    const opts = [...document.querySelectorAll("#search-pop .search-hit")];

async function init() {
  try { dbp = await openDb(); } catch (e) { dbp = null; persistMode = "localstorage"; }
  let fromIdb = null, fromLs = null;
  if (dbp) { try { fromIdb = await idbGet(dbp); } catch (e) { fromIdb = null; } }
  try { fromLs = JSON.parse(localStorage.getItem(LS) || "null"); } catch (e) { fromLs = null; }
  const a = validBundle(fromIdb) ? fromIdb : null;
  const b = validBundle(fromLs) ? fromLs : null;
  const pick = !a ? b : !b ? a : (a.state.rev >= b.state.rev ? a : b);
  if (pick) { dbState = pick.state; journal = pick.journal; persistMode = a && pick === a ? "indexeddb" : persistMode; }
  else {
    dbState = freshSeed();
    const snapshot = structuredClone(dbState);
    const hash = sha256("GENESIS\n" + canonical({ rev: snapshot.rev, n: snapshot.operations.length, stock: snapshot.stock }));
    journal = [{ seq: 16, ts: "2026-09-22T12:00:00.000Z", cmd: "seed", user: "Dane przykładowe", hash, prev: "GENESIS", snapshot }];
    await persist(dbState, journal);
  }
  rebuildIndex();
  const saved = sessionStorage.getItem("riw.demo3.user");
  user = USERS.find(u => u.id === saved) || null;
  route = (location.hash || "#pulpit").replace("#", "") || "pulpit";

    hold: null,
    get state() { return dbState; },
    get ready() { return true; },
    plan(d, wh) { return planCommit(dbState, d || draft, user, wh || activeWh()); }
  };
  paint();
}
