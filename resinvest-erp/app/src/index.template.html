<!DOCTYPE html>
<html lang="pl" data-theme="@@DEFAULT_THEME@@" data-edition="@@EDITION@@">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="ResInvest ERP 3.7 — obrót i magazynowanie biomasy drzewnej: zakupy, planer zakupów, produkcja zrębki, sprzedaż, transport, inwentaryzacja, raporty z wysyłką e-mailem, powiadomienia, flota własna i zewnętrzna, audyt. PL · CS · EN.">
<meta name="generator" content="ResInvest ERP build @@VERSION@@ · @@BUILT@@">
<title>ResInvest ERP</title>
<link rel="icon" type="image/svg+xml" href="@@ICON_SVG@@">
<link rel="apple-touch-icon" href="@@ICON_PNG@@">
<meta name="theme-color" content="#1E4634">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ResInvest ERP">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
/* Przed pierwszym malowaniem: motyw (bez „mignięcia” jasnego tła) i decyzja o intro (ekran z pierwszą klatką filmu). */
(function () {
  var d = document.documentElement, th = null, vars = "", res = "";
  try { th = localStorage.getItem("riw.theme"); vars = localStorage.getItem("riw.themeVars") || ""; res = localStorage.getItem("riw.uiRes") || ""; } catch (e) {}
  if (th === "office98" || th === "office2003") th = "office2007";                            // motywy wycofane w 3.14
  if (/^(pearl|graphite|azure|ultra|premium|glass|aurum|waga|office2007|office2013|office2019|winxp|ubuntu|fedora|vector|render3d|gradient|custom)$/.test(th || "")) d.setAttribute("data-theme", th);
  if ((th === "custom" || th === "gradient") && /^(--[a-z0-9-]+:[^;{}<>]*;)*$/i.test(vars)) d.style.cssText = vars;   // kolory użytkownika
  /* 3.14: rozdzielczość robocza interfejsu (skala) — przed pierwszym malowaniem */
  var m = /^(\d{3,4})x\d{3,4}$/.exec(res); if (m && screen.width) d.style.zoom = String(Math.round(Math.min(1.6, Math.max(0.6, screen.width / +m[1])) * 100) / 100);
  /* 3.13: ekran startowy (splash) zawsze od pierwszej klatki — intro albo ekran ładowania bazy */
  d.className += " intro-boot";
})();
</script>
<style>
/*@@STYLES@@*/
</style>
</head>
<body>
<!-- Intro: pierwsza klatka filmu widoczna od razu; film i przyciski dołącza intro.js -->
<div id="splash" class="splash boot"><img class="splash-poster" alt="" aria-hidden="true" src="@@INTRO_POSTER@@"></div>
<div id="app"></div>
<noscript><p style="padding:24px;font:16px sans-serif">ResInvest ERP wymaga włączonej obsługi JavaScript. · ResInvest ERP requires JavaScript.</p></noscript>
<script>
/* Film intro (H.264 + AAC) osadzony przez tools/build.mjs — nie edytować ręcznie. */
var INTRO_SRC = "@@INTRO_MEDIA@@";
var INTRO_POSTER = "@@INTRO_POSTER@@";
/* Edycja Premium: zdjęcie ekranu startowego (pusty napis w edycji standardowej). */
var RIW_HERO = "@@HERO@@";
</script>
<script>
/* Konfiguracja z config/app.config.json */
var RIW_CONFIG = @@CONFIG@@;
</script>
<script>
/* Czcionki PDF (ResInvestDocSans — podzbiór Liberation Sans, SIL OFL 1.1) */
var RIW_FONTS = @@FONTS@@;
</script>
<!--@@SCRIPTS@@-->
<script>
"use strict";
/* Start: intro (muzyka możliwie natychmiast), równolegle aplikacja — logowanie lub pulpit; ekran startowy do gotowości bazy. */
try { Intro.play(); } catch (e) { console.error(e); }
App.init().then(function () { Splash.ready(); }, function (e) { console.error(e); Splash.ready(); document.getElementById("app").innerHTML = '<p style="padding:24px">' + String(e && e.message || e) + '</p>'; });
</script>
</body>
</html>
